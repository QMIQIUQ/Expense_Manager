  <line x1="177" y1="922" x2="503" y2="922" stroke="#eceef3"/>
  <circle cx="197" cy="947" r="17" fill="#eef7f2"/><text x="192" y="953" class="tiny" fill="#3d9b73">車</text><text x="226" y="946" class="small">交通卡</text><text x="226" y="967" class="tiny muted">昨天 · 交通</text><text x="474" y="954" class="small" text-anchor="end">−$ 280</text>
  <rect x="158" y="985" width="364" height="68" fill="#fff"/>
  <circle cx="201" cy="1009" r="28" fill="url(#accent)"/><path d="M201 997v24m-12-12h24" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="269" cy="1009" r="28" fill="#fff" stroke="#e4e2eb"/><path d="M262 1006v-3a7 7 0 0 1 14 0v8l3 3h-20z" fill="none" stroke="#647084" stroke-width="1.7"/>
  <text x="48" y="1090" class="tiny" fill="#6d39d0" font-weight="700">保留兩個 56×56px 獨立 FAB · 左 16px · 底部含 safe area</text>
</svg>
