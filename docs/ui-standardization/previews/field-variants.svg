<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Expense Manager field variants</title>
  <desc id="desc">A design preview comparing standard, compact, and prominent native form controls using shared dimensions, typography, radius, and focus tokens.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.3px; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; }
      .card-title { font-size: 20px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .field-text { font-size: 14px; }
      .prominent-text { font-size: 16px; }
      .note { font-size: 13px; }
    </style>
  </defs>
  <rect width="1320" height="760" fill="#f4f2f8"/>
  <text x="56" y="55" class="eyebrow" fill="#7652ba">EXPENSE MANAGER · FORM CONTROLS</text>
  <text x="56" y="103" class="title" fill="#211b27">Three field variants, one shared geometry</text>
  <text x="56" y="135" class="subtitle" fill="#6c6675">Compact keeps the 44px target; prominent fields support primary amount entry.</text>

  <g transform="translate(56 176)">
    <rect width="384" height="470" rx="18" fill="#ffffff" stroke="#e0dce5"/>
    <text x="28" y="48" class="card-title" fill="#211b27">Standard</text>
    <text x="28" y="76" class="note" fill="#716a7d">一般欄位 · 44px · 14px</text>
    <text x="28" y="128" class="label" fill="#292434">Payment method</text>
    <rect x="28" y="142" width="328" height="44" rx="8" fill="#ffffff" stroke="#d8d2e2"/>
    <text x="40" y="170" class="field-text" fill="#292434">Select an account</text>
    <path d="m326 160 7 7 7-7" fill="none" stroke="#716a7d" stroke-width="2"/>
    <text x="28" y="224" class="label" fill="#292434">Notes</text>
    <rect x="28" y="238" width="328" height="88" rx="8" fill="#ffffff" stroke="#d8d2e2"/>
    <text x="40" y="268" class="field-text" fill="#716a7d">Add a note</text>
    <text x="28" y="374" class="note" fill="#716a7d">8px × 12px padding · 1px border</text>
    <text x="28" y="398" class="note" fill="#716a7d">8px radius · theme focus ring</text>
  </g>

  <g transform="translate(468 176)">
    <rect width="384" height="470" rx="18" fill="#ffffff" stroke="#e0dce5"/>
    <text x="28" y="48" class="card-title" fill="#211b27">Compact</text>
    <text x="28" y="76" class="note" fill="#716a7d">密集篩選 · 44px · 14px</text>
    <text x="28" y="128" class="label" fill="#292434">Sort by</text>
    <rect x="28" y="142" width="328" height="44" rx="8" fill="#ffffff" stroke="#d8d2e2"/>
    <text x="36" y="170" class="field-text" fill="#292434">Newest first</text>
    <path d="m326 160 7 7 7-7" fill="none" stroke="#716a7d" stroke-width="2"/>
    <text x="28" y="224" class="label" fill="#292434">Filter</text>
    <rect x="28" y="238" width="328" height="44" rx="8" fill="#ffffff" stroke="#d8d2e2"/>
    <text x="36" y="266" class="field-text" fill="#292434">All categories</text>
    <path d="m326 256 7 7 7-7" fill="none" stroke="#716a7d" stroke-width="2"/>
    <text x="28" y="374" class="note" fill="#716a7d">4px × 8px padding · 1px border</text>
    <text x="28" y="398" class="note" fill="#716a7d">44px target retained for touch</text>
  </g>

  <g transform="translate(880 176)">
    <rect width="384" height="470" rx="18" fill="#ffffff" stroke="#e0dce5"/>
    <text x="28" y="48" class="card-title" fill="#211b27">Prominent</text>
    <text x="28" y="76" class="note" fill="#716a7d">主要金額輸入 · 52px · 16px</text>
    <text x="28" y="128" class="label" fill="#292434">Amount</text>
    <rect x="28" y="142" width="328" height="52" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="44" y="175" class="prominent-text" fill="#292434">1,250.00</text>
    <text x="28" y="232" class="label" fill="#292434">Validation</text>
    <rect x="28" y="246" width="328" height="52" rx="8" fill="#ffffff" stroke="#c2414a" stroke-width="2"/>
    <text x="44" y="279" class="prominent-text" fill="#292434">0.00</text>
    <text x="28" y="324" class="note" fill="#a9323a">Amount must be greater than zero.</text>
    <text x="28" y="374" class="note" fill="#716a7d">12px × 16px padding · 2px border</text>
    <text x="28" y="398" class="note" fill="#716a7d">8px radius · theme focus ring</text>
  </g>

  <text x="56" y="706" class="note" fill="#6c6675">DatePicker reserves trailing space for its calendar button. Native checkbox and radio remain 18px and theme-accented.</text>
</svg>
