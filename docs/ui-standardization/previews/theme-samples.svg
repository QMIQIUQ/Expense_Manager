<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">Expense Manager current theme samples</title>
  <desc id="desc">Illustrative comparison of a form card, input, label, button, and status badge in four currently supported appearance variants.</desc>
  <defs>
    <style>
      .pageTitle{font:700 28px 'Segoe UI',sans-serif;fill:#24222a}.subtitle{font:15px 'Segoe UI',sans-serif;fill:#66616c}.themeTitle{font:700 20px 'Segoe UI',sans-serif}.themeMeta{font:13px 'Segoe UI',sans-serif;opacity:.75}.label{font:600 13px 'Segoe UI',sans-serif}.fieldText{font:15px 'Segoe UI',sans-serif}.small{font:12px 'Segoe UI',sans-serif}.button{font:700 14px 'Segoe UI',sans-serif}.sampleTag{font:700 12px 'Segoe UI',sans-serif}
    </style>
  </defs>
  <rect width="1440" height="930" fill="#f4f2f6"/>
  <text x="56" y="58" class="pageTitle">目前支援的主題外觀 · 現行樣式</text>
  <text x="56" y="88" class="subtitle">同一張表單示意：紫色 light / dark 與 Warm Kitty light / dark。依 CSS 與元件樣式繪製，非瀏覽器截圖。</text>
  <g transform="translate(56 128)">
    <rect width="638" height="350" rx="18" fill="#fff" stroke="#ddd8e4"/>
    <text x="28" y="42" class="themeTitle" fill="#7c3aed">紫色主題 · 淺色</text>
    <text x="28" y="66" class="themeMeta" fill="#6b7280">--accent-primary · #7c3aed</text>
    <rect x="28" y="91" width="582" height="220" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <text x="52" y="128" class="label" fill="#1f2937">描述</text>
    <rect x="52" y="143" width="352" height="46" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="68" y="172" class="fieldText" fill="#1f2937">和團隊午餐</text>
    <text x="52" y="221" class="label" fill="#1f2937">分類</text>
    <rect x="52" y="236" width="116" height="32" rx="16" fill="#ede9fe"/>
    <text x="68" y="257" class="sampleTag" fill="#7c3aed">🍜 餐飲</text>
    <rect x="430" y="238" width="150" height="44" rx="8" fill="#7c3aed"/>
    <text x="505" y="265" text-anchor="middle" class="button" fill="#fff">儲存支出</text>
    <rect x="28" y="319" width="98" height="22" rx="11" fill="#ecfdf5"/>
    <text x="77" y="334" text-anchor="middle" class="small" fill="#15803d">成功</text>
  </g>
