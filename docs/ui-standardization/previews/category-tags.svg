<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
  <title id="title">分類與標籤選擇方式比較</title>
  <desc id="desc">Current category icon grid and compact tag picker compared with two proposed category and tag layouts. Proposals are not implemented.</desc>
  <defs><style>
    .h{font:700 27px 'Microsoft JhengHei','Segoe UI',sans-serif;fill:#27222d}.sub{font:14px 'Microsoft JhengHei','Segoe UI',sans-serif;fill:#645d6b}.tag{font:700 12px 'Microsoft JhengHei','Segoe UI',sans-serif}.label{font:600 14px 'Microsoft JhengHei','Segoe UI',sans-serif;fill:#37313e}.small{font:12px 'Microsoft JhengHei','Segoe UI',sans-serif;fill:#625c68}.mini{font:11px 'Microsoft JhengHei','Segoe UI',sans-serif;fill:#6b6571}.badge{font:700 11px 'Microsoft JhengHei','Segoe UI',sans-serif;letter-spacing:.5px}
  </style></defs>
  <rect width="1440" height="690" fill="#f5f3f7"/>
  <text x="52" y="54" class="h">分類與 Tags：現行方式與待選方案</text>
  <text x="52" y="82" class="sub">現行元件依 origin/main 繪製；Proposal A/B 僅供決策，尚未實作。</text>
  <g transform="translate(52 112)">
    <rect width="424" height="505" rx="18" fill="#fff" stroke="#dcd7e2"/>
    <rect x="22" y="20" width="82" height="24" rx="12" fill="#ece8f2"/><text x="63" y="36" text-anchor="middle" class="badge" fill="#514a58">CURRENT</text>
    <text x="22" y="76" class="label">分類：最近使用 + 其他分類</text>
    <text x="22" y="99" class="mini">選取圖示格，全部分類分組顯示</text>
    <rect x="22" y="117" width="180" height="68" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="112" y="145" text-anchor="middle" font-size="21">🍜</text><text x="112" y="170" text-anchor="middle" class="small">餐飲 · 已選</text>
    <rect x="214" y="117" width="180" height="68" rx="10" fill="#fff" stroke="#d1d5db"/><text x="304" y="145" text-anchor="middle" font-size="21">🚗</text><text x="304" y="170" text-anchor="middle" class="small">交通</text>
    <rect x="22" y="198" width="180" height="68" rx="10" fill="#fff" stroke="#d1d5db"/><text x="112" y="226" text-anchor="middle" font-size="21">🛍</text><text x="112" y="251" text-anchor="middle" class="small">購物</text>
    <rect x="214" y="198" width="180" height="68" rx="10" fill="#fff" stroke="#d1d5db"/><text x="304" y="226" text-anchor="middle" font-size="21">🏠</text><text x="304" y="251" text-anchor="middle" class="small">帳單</text>
    <text x="22" y="305" class="label">標籤：compact / frameless</text>
    <rect x="22" y="320" width="372" height="48" rx="9" fill="#fff" stroke="#e1dce5"/><text x="38" y="350" class="small">新增標籤…</text><rect x="302" y="328" width="78" height="32" rx="8" fill="#ede9fe"/><text x="341" y="349" text-anchor="middle" class="tag" fill="#6d28d9">新增</text>
    <rect x="22" y="381" width="96" height="30" rx="15" fill="#ede9fe"/><text x="70" y="401" text-anchor="middle" class="tag" fill="#6d28d9">交通</text><rect x="126" y="381" width="108" height="30" rx="15" fill="#f3f4f6" stroke="#d1d5db"/><text x="180" y="401" text-anchor="middle" class="tag" fill="#4b5563">工作餐</text>
    <text x="22" y="453" class="small">保留最近分類排序、tag ID 和最多 10 個已選標籤。</text>
    <text x="22" y="479" class="mini">以上為現行 UI 形態示意，非 runtime 截圖。</text>
  </g>
  <g transform="translate(508 112)">
    <rect width="424" height="505" rx="18" fill="#fff" stroke="#dcd7e2"/>
    <rect x="22" y="20" width="112" height="24" rx="12" fill="#e8f0ff"/><text x="78" y="36" text-anchor="middle" class="badge" fill="#2858a6">PROPOSAL A</text>
    <text x="22" y="76" class="label">搜尋下拉 + 摺疊標籤</text>
    <text x="22" y="99" class="mini">適合分類數多、欄位高度優先的表單</text>
    <rect x="22" y="120" width="372" height="44" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="40" y="147" class="small">⌕  搜尋分類…</text>
    <rect x="22" y="171" width="372" height="158" rx="9" fill="#fff" stroke="#d1d5db"/>
    <rect x="31" y="180" width="354" height="36" rx="6" fill="#ede9fe"/><text x="47" y="204" class="small">🍜  餐飲</text><text x="367" y="204" text-anchor="end" class="small" fill="#6d28d9">✓</text>
    <text x="47" y="244" class="small">🚗  交通</text><line x1="34" y1="257" x2="383" y2="257" stroke="#eee"/><text x="47" y="281" class="small">🛍  購物</text><line x1="34" y1="293" x2="383" y2="293" stroke="#eee"/><text x="47" y="317" class="small">🏠  帳單</text>
    <rect x="22" y="351" width="372" height="54" rx="9" fill="#faf9fb" stroke="#e1dce5"/><text x="40" y="383" class="label">標籤 · 已選 2 個</text><text x="372" y="383" text-anchor="end" class="small" fill="#6d28d9">展開＋</text>
    <text x="22" y="453" class="small">收合時節省版面；展開後仍用現行 tag 選取按鈕。</text>
    <text x="22" y="479" class="mini">Proposal A：先選分類下拉，再展開標籤。</text>
  </g>
  <g transform="translate(964 112)">
    <rect width="424" height="505" rx="18" fill="#fff" stroke="#dcd7e2"/>
    <rect x="22" y="20" width="112" height="24" rx="12" fill="#e8f0ff"/><text x="78" y="36" text-anchor="middle" class="badge" fill="#2858a6">PROPOSAL B</text>
    <text x="22" y="76" class="label">最近分類格 + 搜尋全部</text>
    <text x="22" y="99" class="mini">兼顧常用快速選擇與完整搜尋</text>
    <rect x="22" y="118" width="180" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="112" y="144" text-anchor="middle" font-size="19">🍜</text><text x="112" y="166" text-anchor="middle" class="mini">餐飲</text>
    <rect x="214" y="118" width="180" height="62" rx="10" fill="#fff" stroke="#d1d5db"/><text x="304" y="144" text-anchor="middle" font-size="19">🚗</text><text x="304" y="166" text-anchor="middle" class="mini">交通</text>
    <rect x="22" y="190" width="372" height="42" rx="8" fill="#fff" stroke="#d1d5db"/><text x="40" y="217" class="small">⌕  搜尋全部分類…</text>
    <text x="22" y="272" class="label">描述與標籤同區</text>
    <rect x="22" y="286" width="372" height="48" rx="8" fill="#fff" stroke="#d1d5db"/><text x="40" y="315" class="small">例如：和團隊午餐</text>
    <rect x="22" y="346" width="103" height="30" rx="15" fill="#ede9fe"/><text x="73" y="366" text-anchor="middle" class="tag" fill="#6d28d9">交通</text><rect x="134" y="346" width="111" height="30" rx="15" fill="#f3f4f6" stroke="#d1d5db"/><text x="189" y="366" text-anchor="middle" class="tag" fill="#4b5563">工作餐</text><rect x="254" y="346" width="108" height="30" rx="15" fill="#fff" stroke="#d1d5db"/><text x="308" y="366" text-anchor="middle" class="tag" fill="#4b5563">＋ 新增</text>
    <text x="22" y="453" class="small">最近分類可一鍵選；非近期分類使用文字搜尋。</text>
    <text x="22" y="479" class="mini">Proposal B：標籤常駐顯示，需驗證小螢幕高度。</text>
  </g>
  <text x="52" y="655" class="sub">決策重點：分類密度與搜尋方式、標籤是否摺疊，以及手機版是否優先節省首屏高度。</text>
</svg>
