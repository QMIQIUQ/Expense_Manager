name: Deploy web to Firebase Hosting

on:
  push:
    branches:
      - main
      - firebase-testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Detect Firestore rules or index changes
        id: firestore-changes
        if: github.ref_name == 'main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          if echo "$changed_files" | grep -Eq '^web/firestore\.rules$'; then
            echo "rules_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed_files" | grep -Eq '^web/firestore\.indexes\.json$'; then
            echo "indexes_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "indexes_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Google Cloud
        if: steps.firestore-changes.outputs.rules_changed == 'true' || steps.firestore-changes.outputs.indexes_changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.firestore-changes.outputs.rules_changed == 'true' || steps.firestore-changes.outputs.indexes_changed == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: expense-manager-41afb

      - name: Deploy Firestore rules through the Rules API
        if: steps.firestore-changes.outputs.rules_changed == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          ruleset_request="$(jq -n --rawfile rules firestore.rules '{source:{files:[{name:"firestore.rules",content:$rules}]}}')"
          ruleset_response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            --data "$ruleset_request" \
            "https://firebaserules.googleapis.com/v1/projects/expense-manager-41afb/rulesets")"
          ruleset_name="$(jq -er '.name' <<< "$ruleset_response")"
          release_name="projects/expense-manager-41afb/releases/cloud.firestore"
          release_url="https://firebaserules.googleapis.com/v1/$release_name"
          release_status="$(curl --silent --show-error -o /tmp/firestore-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $access_token" "$release_url")"
          release_request="$(jq -n --arg name "$release_name" --arg rulesetName "$ruleset_name" '{name:$name,rulesetName:$rulesetName}')"
          if [ "$release_status" = '200' ]; then
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H "Authorization: Bearer $access_token" \
              -H 'Content-Type: application/json' \
              --data "$release_request" \
              "$release_url?updateMask=rulesetName"
          elif [ "$release_status" = '404' ]; then
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $access_token" \
              -H 'Content-Type: application/json' \
              --data "$release_request" \
              'https://firebaserules.googleapis.com/v1/projects/expense-manager-41afb/releases'
          else
            cat /tmp/firestore-release.json >&2
            echo "Could not read the current Firestore rules release (HTTP $release_status)." >&2
            exit 1
          fi
          echo "Published Firestore ruleset $ruleset_name."

      - name: Deploy Firestore indexes
        if: steps.firestore-changes.outputs.indexes_changed == 'true'
        working-directory: web
        run: |
          npx --yes firebase-tools@15.34.0 deploy \
            --only firestore:indexes \
            --project expense-manager-41afb \
            --non-interactive

      - name: Build
        working-directory: web
        run: npm run build
        env:
          FIREBASE_DEPLOY: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Preview shares production data, so friend spending is enabled only on the live build.
          VITE_FRIEND_SPENDING_ENABLED: ${{ github.ref_name == 'main' && 'true' || 'false' }}

      - name: Deploy to Firebase Hosting
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: expense-manager-41afb
          channelId: ${{ github.ref_name == 'main' && 'live' || 'compact-navigation-v2' }}
          expires: ${{ github.ref_name == 'firebase-testing' && '7d' || '' }}
          entryPoint: ./web

      - name: Output Deployment URL
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOYMENT_URL="$LIVE_URL"
            CHANNEL="Live (Production)"
          else
            DEPLOYMENT_URL="$PREVIEW_URL"
            CHANNEL="Preview (firebase-testing; compact-navigation-v2)"
          fi
          echo "### Deployment succeeded 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Website URL**: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: $CHANNEL" >> $GITHUB_STEP_SUMMARY
          if [ -n "$EXPIRE_TIME" ]; then
            echo "- **Preview expires**: $EXPIRE_TIME" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to Firebase Hosting!" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "============================================"
          echo "🎉 Firebase Hosting deployment succeeded!"
          echo "============================================"
          echo "Website URL: $DEPLOYMENT_URL"
          echo "Channel: $CHANNEL"
          if [ -n "$EXPIRE_TIME" ]; then
            echo "Preview expires: $EXPIRE_TIME"
          fi
          echo "============================================"
        env:
          LIVE_URL: https://expense-manager-41afb.web.app/
          PREVIEW_URL: ${{ steps.firebase-deploy.outputs.details_url }}
          EXPIRE_TIME: ${{ steps.firebase-deploy.outputs.expire_time_formatted }}
