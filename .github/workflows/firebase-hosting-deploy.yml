name: Deploy web to Firebase Hosting

on:
  push:
    branches:
      - main
      - firebase-testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
        env:
          FIREBASE_DEPLOY: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: expense-manager-41afb
          channelId: ${{ github.ref_name == 'main' && 'live' || 'compact-navigation-v2' }}
          expires: 7d
          entryPoint: ./web

      - name: Output Deployment URL
        run: |
          DEPLOYMENT_URL="${{ steps.firebase-deploy.outputs.details_url }}"
          EXPIRE_TIME="${{ steps.firebase-deploy.outputs.expire_time_formatted }}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            CHANNEL="Live (Production)"
          else
            CHANNEL="Preview (firebase-testing; compact-navigation-v2)"
          fi
          echo "### Deployment succeeded 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment URL**: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: $CHANNEL" >> $GITHUB_STEP_SUMMARY
          if [ -n "$EXPIRE_TIME" ]; then
            echo "- **Preview expires**: $EXPIRE_TIME" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to Firebase Hosting!" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "============================================"
          echo "🎉 Firebase Hosting deployment succeeded!"
          echo "============================================"
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "Channel: $CHANNEL"
          if [ -n "$EXPIRE_TIME" ]; then
            echo "Preview expires: $EXPIRE_TIME"
          fi
          echo "============================================"
