name: Deploy web to Firebase Hosting

on:
  push:
    branches:
      - main
      - firebase-testing

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Detect Firestore rules or index changes
        id: firestore-changes
        if: github.ref_name == 'main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^web/firestore\.(rules|indexes\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Google Cloud
        if: steps.firestore-changes.outputs.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        if: steps.firestore-changes.outputs.changed == 'true'
        working-directory: web
        run: |
          npx --yes firebase-tools@15.34.0 deploy \
            --only firestore:rules,firestore:indexes \
            --project expense-manager-41afb \
            --non-interactive

      - name: Build
        working-directory: web
        run: npm run build
        env:
          FIREBASE_DEPLOY: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Preview shares production data, so friend spending is enabled only on the live build.
          VITE_FRIEND_SPENDING_ENABLED: ${{ github.ref_name == 'main' && 'true' || 'false' }}

      - name: Deploy to Firebase Hosting
        id: firebase-deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: expense-manager-41afb
          channelId: ${{ github.ref_name == 'main' && 'live' || 'compact-navigation-v2' }}
          expires: ${{ github.ref_name == 'firebase-testing' && '7d' || '' }}
          entryPoint: ./web

      - name: Output Deployment URL
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            DEPLOYMENT_URL="$LIVE_URL"
            CHANNEL="Live (Production)"
          else
            DEPLOYMENT_URL="$PREVIEW_URL"
            CHANNEL="Preview (firebase-testing; compact-navigation-v2)"
          fi
          echo "### Deployment succeeded 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Website URL**: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel**: $CHANNEL" >> $GITHUB_STEP_SUMMARY
          if [ -n "$EXPIRE_TIME" ]; then
            echo "- **Preview expires**: $EXPIRE_TIME" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to Firebase Hosting!" >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "============================================"
          echo "🎉 Firebase Hosting deployment succeeded!"
          echo "============================================"
          echo "Website URL: $DEPLOYMENT_URL"
          echo "Channel: $CHANNEL"
          if [ -n "$EXPIRE_TIME" ]; then
            echo "Preview expires: $EXPIRE_TIME"
          fi
          echo "============================================"
        env:
          LIVE_URL: https://expense-manager-41afb.web.app/
          PREVIEW_URL: ${{ steps.firebase-deploy.outputs.details_url }}
          EXPIRE_TIME: ${{ steps.firebase-deploy.outputs.expire_time_formatted }}
